name: CI

# Phase 1: secret scan, lint, types, tests. The full QA and prod pipelines (scans, image build,
# ECR push, EKS deploy, approval-gated promotion) are copied from P3 in Phase 4 (DECISIONS D-04).

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo --redact --verbose

  test:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    needs: gitleaks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mockbank
          POSTGRES_PASSWORD: mockbank-ci
          POSTGRES_DB: mockbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockbank" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      MOCK_BANK_TEST_DATABASE_URL: postgresql+psycopg://mockbank:mockbank-ci@localhost:5432/mockbank
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest
