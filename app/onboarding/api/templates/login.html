{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Paste your access token. Tokens stand in for the bank's single sign-on.</p>
{% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/ui/login" class="card narrow">
  <input type="hidden" name="form_token" value="{{ form_token }}">
  <label for="token">Access token</label>
  <input id="token" name="token" type="password" autocomplete="off" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
