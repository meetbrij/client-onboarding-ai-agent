# Default deny for traffic into this namespace, then the few paths the service needs. Egress is left open
# (KYC in another namespace, Bedrock, Langfuse, AWS APIs). Enforced only if the cluster's CNI enforces
# NetworkPolicy; harmless otherwise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-alb
spec:
  podSelector:
    matchLabels:
      app: onboarding-api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mock-bank-from-api
spec:
  podSelector:
    matchLabels:
      app: onboarding-mock-bank
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: onboarding-api
      ports:
        - port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-services
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: onboarding-api
        - podSelector:
            matchLabels:
              app: onboarding-mock-bank
      ports:
        - port: 5432
