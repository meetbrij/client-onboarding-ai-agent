# Copies every key of each Secrets Manager secret into a Kubernetes Secret of the same short name,
# refreshed hourly. The secret values are set by hand (infra/terraform/README.md): they are never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: pg-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/onboarding/pg-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
