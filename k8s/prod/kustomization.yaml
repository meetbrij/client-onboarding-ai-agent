apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onboarding-prod
resources:
  - ../base
  - external-secrets.yaml
  - ingress.yaml
patches:
  # Strategic-merge patches match env vars by name, so reordering the base manifest cannot break them.
  - target:
      kind: Deployment
      name: onboarding-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: onboarding-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: ENVIRONMENT
                    value: prod
                  - name: KYC_BASE_URL
                    value: http://nodejs-service.prod.svc.cluster.local
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ebs-sc-retain
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
# The prod tag is set by the prod pipeline in a temporary copy (prod-<sha>); it is never committed back.
images:
  - name: onboarding
    newName: client-onboarding
    newTag: "unset"
