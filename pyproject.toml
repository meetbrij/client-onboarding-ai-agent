[project]
name = "client-onboarding-ai-agent"
version = "0.1.0"
description = "Agentic client onboarding workflow with a human approval gate and a hash-chained audit log. Synthetic data only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "langgraph>=0.6",
    "boto3>=1.35",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg-pool>=3.2",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/onboarding", "app/mock_bank", "app/fake_kyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # long strings and SQL are left to ruff format

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Tests poke at Optional state fields and build models from plain strings; the application code stays strict on these.
module = "tests.*"
disable_error_code = ["union-attr", "arg-type", "func-returns-value", "var-annotated", "index", "call-arg", "operator"]
