# SonarCloud project settings. The job is off until the repository variable SONAR_ENABLED is "true"
# and the SONAR_TOKEN secret exists; create the project in SonarCloud first (organization meetbrij).
sonar.organization=meetbrij
sonar.projectKey=meetbrij_client-onboarding-ai-agent
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.exclusions=app/onboarding/api/static/**,data/**,evals/cases/**
sonar.sourceEncoding=UTF-8
